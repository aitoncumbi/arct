<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arct Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand" aria-label="Arct">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 20V9.5L12 3l9 6.5V20h-6v-6H9v6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Arct</span>
    </div>
    <input id="projName" class="proj-name" aria-label="Project name" spellcheck="false" maxlength="60">
    <div class="spacer"></div>
    <button id="undoBtn" class="btn icon" title="Undo (Ctrl+Z)" aria-label="Undo"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 7 4 12l5 5M4 12h10a5 5 0 0 1 0 10h-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg></button>
    <button id="redoBtn" class="btn icon" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg viewBox="0 0 24 24" width="18" height="18"><path d="m15 7 5 5-5 5M20 12H10a5 5 0 0 0 0 10h2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg></button>
    <details class="menu" id="fileMenu">
      <summary class="btn">Project</summary>
      <div class="menu-list">
        <button data-act="new">New or open project…</button>
        <button data-act="export">Export project file</button>
        <button data-act="import">Import project file…</button>
        <button data-act="shot">Save view as image</button>
      </div>
    </details>
  </header>

  <nav class="tools" id="tools" aria-label="Tools"></nav>

  <main class="stage" id="stage">
    <canvas></canvas>
    <div class="labels" aria-hidden="true"></div>
    <div class="view-bar">
      <div class="seg" id="viewSeg" role="group" aria-label="View">
        <button data-view="3d" aria-pressed="true">3D</button>
        <button data-view="2d" aria-pressed="false">Plan</button>
      </div>
      <button id="wallsBtn" class="btn chip" aria-pressed="false" title="Lower the walls to see inside">Cutaway</button>
      <button id="fitBtn" class="btn chip" title="Fit the plot in view">Fit</button>
    </div>
    <div class="hint" id="hint"></div>
  </main>

  <aside class="panel" id="panel">
    <button class="panel-toggle" id="panelToggle" aria-expanded="false"><span id="panelTitle">Project</span><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m6 15 6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="panel-body">
      <section id="toolOptions"></section>
      <section id="props"></section>
    </div>
  </aside>
</div>

<dialog id="startDlg" class="dlg"></dialog>
<dialog id="shareDlg" class="dlg"></dialog>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<script type="module" src="/src/main.js"></script>
</body>
</html>
